[package]
autotests = false
name = "intersect-model"
description = "Shared model APIs and Rcore execution without Xtext."
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
documentation = "https://docs.rs/intersect-model"
keywords = ["modeling", "metamodel", "rcore", "wasm"]
categories = ["data-structures", "compilers"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
sha2.workspace = true
iri-string.workspace = true
self_cell = "=1.3.0"
rustc-hash = "=2.1.1"
rhai = { version = "=1.26.1", optional = true, default-features = false, features = ["std", "only_i64", "no_float", "no_module", "no_custom_syntax", "no_time"] }

# Exact arithmetic only; shared scalar codecs remain in definitions.
num-bigint = { version = "=0.4.6", default-features = false }
num-integer = { version = "=0.1.46", default-features = false }
num-traits = { version = "=0.2.19", default-features = false }

# Host-only: hashes the compiler sources into the crate's SOURCE_IDENTITY.
[build-dependencies]
intersect-build-support = { path = "../intersect-build-support", version = "0.1.0-alpha.2" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }

[features]
# Milestone-only tests (AGENTS.md test tiers): slow tests and legacy old-path
# tests compile or run only with this feature.
milestone-tests = []
default = []
# Experimental, language-neutral shared read-only component proof.
components = []
xmi = []
sqlite = ["dep:rusqlite"]
codegen = []
model-edit-allocation-metrics = []
rhai = ["dep:rhai"]
# Host benchmark instrumentation only; does not change library semantics.
allocation-profile = []

[[example]]
name = "xmi_conversion_probe"
required-features = ["xmi"]

[[example]]
name = "model_component_usage"
required-features = ["components"]

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "byte_validation_allocations"
path = "tests/byte_validation_allocations.rs"

[[test]]
name = "input_string_admission_allocations"
path = "tests/input_string_admission_allocations.rs"

[[test]]
name = "scalar_validation_allocations"
path = "tests/scalar_validation_allocations.rs"
