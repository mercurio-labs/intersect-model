[package]
name = "intersect-model-only-consumer"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.88"
publish = false

# Deliberately isolated: workspace feature unification must not enable Xtext.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
intersect-model = { version = "0.1.0-alpha.2", path = "../../crates/intersect-model" }
serde_json = "1.0.149"

[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.test-fast.package."*"]
opt-level = 3
