[package]
name = "intersect-model-acceptance"
description = "Unpublished model qualification harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
intersect-model = { workspace = true, features = ["xmi", "sqlite", "codegen"] }
intersect-model-test-support = { path = "../support" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }

[features]
milestone-tests = []
allocation-profile = ["intersect-model/allocation-profile"]

[[test]]
name = "core"
path = "tests/core.rs"

[[test]]
name = "definitions"
path = "tests/definitions.rs"

[[test]]
name = "language"
path = "tests/language.rs"

[[test]]
name = "sqlite"
path = "tests/sqlite.rs"

[[test]]
name = "xmi"
path = "tests/xmi.rs"

[[example]]
name = "bundle_validation_probe"
path = "examples/bundle_validation_probe.rs"
test = false

